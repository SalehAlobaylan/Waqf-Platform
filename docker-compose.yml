# Waqf Platform - Docker Compose
# Requires a Neon database. Set DATABASE_URL in your .env file.
# Example: DATABASE_URL="postgresql://user:pass@ep-xxx.us-east-2.aws.neon.tech/waqf?sslmode=require"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
