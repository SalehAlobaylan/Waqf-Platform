name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

jobs:
  test:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Backfill usernames
        run: npm run db:backfill-usernames || true

      - name: Setup Playwright Browsers
        run: npx playwright install chromium

      - name: Run API Validation Contract Tests
        run: npm run test:validation
        env:
          ENABLE_DEV_LOGIN: "true"
          NEXT_PUBLIC_ENABLE_DEV_LOGIN: "true"

      - name: Run E2E Tests
        run: npm test
        env:
          ENABLE_DEV_LOGIN: "true"
          NEXT_PUBLIC_ENABLE_DEV_LOGIN: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7

  lint:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Audit dependencies
        run: npm run audit:check

      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}

      - name: Check message key parity
        run: npm run i18n:check

  db-check:
    name: Database Schema Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Check for migration needed
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script > migration.sql 2>&1 || true

          # Ignore the migration-managed full-text search index: Prisma cannot
          # model the GIN/tsvector index or its trigger-managed function, so it
          # is created by migration 0002 and always appears in the diff. Any
          # other CREATE/ALTER/DROP means the database is genuinely out of sync.
          grep -v 'project_search_idx' migration.sql > drift.sql || true

          if grep -qE '^[[:space:]]*(CREATE|ALTER|DROP|TRUNCATE|INSERT)[[:space:]]' drift.sql; then
            echo "Database is out of sync with schema"
            cat drift.sql
            exit 1
          else
            echo "Database schema is in sync (migration-managed full-text search index ignored)"
          fi
